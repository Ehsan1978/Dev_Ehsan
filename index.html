<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Memo App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f6f7fb; color: #1f2937; }
    .container { max-width: 920px; margin: 32px auto; background: #fff; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.08); padding: 24px; }
    h1 { margin-top: 0; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    button { border: 0; background: #2563eb; color: #fff; padding: 10px 14px; border-radius: 8px; cursor: pointer; }
    button.secondary { background: #4b5563; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    .status { margin: 8px 0 18px; color: #374151; }
    .memo-card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fafafa; }
    .memo-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
    .memo-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .transcript { background: #f3f4f6; border-radius: 8px; padding: 8px; margin-top: 10px; white-space: pre-wrap; }
    .muted { color: #6b7280; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Voice Memo Recorder</h1>
    <p class="muted">Record, play back, and optionally transcribe your memos in the browser.</p>

    <div class="controls">
      <button id="recordBtn">Start Recording</button>
      <button id="clearBtn" class="secondary">Clear All Memos</button>
    </div>

    <div id="status" class="status">Ready.</div>
    <div id="memoList"></div>
  </div>

  <script>
    const recordBtn = document.getElementById('recordBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusEl = document.getElementById('status');
    const memoListEl = document.getElementById('memoList');

    let isRecording = false;
    let mediaRecorder = null;
    let stream = null;
    let chunks = [];
    let recognition = null;
    let liveTranscript = '';
    const memos = [];

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function supportsTranscription() {
      return 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window;
    }

    function renderMemos() {
      memoListEl.innerHTML = '';
      if (!memos.length) {
        memoListEl.innerHTML = '<p class="muted">No memos yet.</p>';
        return;
      }

      memos.forEach((memo, index) => {
        const card = document.createElement('div');
        card.className = 'memo-card';

        const header = document.createElement('div');
        header.className = 'memo-header';
        header.innerHTML = `<strong>${memo.name}</strong><span class="muted">${memo.createdAt}</span>`;

        const audio = document.createElement('audio');
        audio.controls = true;
        audio.src = memo.url;
        audio.style.width = '100%';

        const actions = document.createElement('div');
        actions.className = 'memo-actions';

        const download = document.createElement('button');
        download.className = 'secondary';
        download.textContent = 'Download';
        download.onclick = () => {
          const a = document.createElement('a');
          a.href = memo.url;
          a.download = `${memo.name}.webm`;
          a.click();
        };

        const remove = document.createElement('button');
        remove.className = 'secondary';
        remove.textContent = 'Delete';
        remove.onclick = () => {
          URL.revokeObjectURL(memo.url);
          memos.splice(index, 1);
          renderMemos();
        };

        actions.appendChild(download);
        actions.appendChild(remove);

        card.appendChild(header);
        card.appendChild(audio);
        card.appendChild(actions);

        if (memo.transcript) {
          const transcript = document.createElement('div');
          transcript.className = 'transcript';
          transcript.textContent = `Transcript:\n${memo.transcript}`;
          card.appendChild(transcript);
        }

        memoListEl.appendChild(card);
      });
    }

    function startSpeechRecognition() {
      if (!supportsTranscription()) return;
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      liveTranscript = '';
      recognition.onresult = (event) => {
        let combined = '';
        for (let i = 0; i < event.results.length; i++) {
          combined += event.results[i][0].transcript + ' ';
        }
        liveTranscript = combined.trim();
      };

      recognition.onerror = () => {
        setStatus('Recording audio, but speech recognition failed.');
      };

      recognition.start();
    }

    function stopSpeechRecognition() {
      if (recognition) {
        recognition.stop();
        recognition = null;
      }
    }

    async function startRecording() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = [];
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) chunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'audio/webm' });
          const url = URL.createObjectURL(blob);
          const stamp = new Date();
          memos.unshift({
            name: `Memo ${stamp.toLocaleTimeString()}`,
            createdAt: stamp.toLocaleString(),
            url,
            transcript: liveTranscript || ''
          });
          renderMemos();
          setStatus('Saved memo.');
        };

        mediaRecorder.start();
        startSpeechRecognition();
        isRecording = true;
        recordBtn.textContent = 'Stop Recording';
        setStatus('Recording...');
      } catch (error) {
        setStatus('Could not start recording. Check microphone permissions.');
      }
    }

    function stopRecording() {
      if (!mediaRecorder) return;
      mediaRecorder.stop();
      stream.getTracks().forEach(track => track.stop());
      stopSpeechRecognition();
      isRecording = false;
      recordBtn.textContent = 'Start Recording';
    }

    recordBtn.addEventListener('click', async () => {
      if (!isRecording) {
        await startRecording();
      } else {
        stopRecording();
      }
    });

    clearBtn.addEventListener('click', () => {
      memos.forEach(m => URL.revokeObjectURL(m.url));
      memos.length = 0;
      renderMemos();
      setStatus('All memos cleared.');
    });

    if (!navigator.mediaDevices || !window.MediaRecorder) {
      setStatus('Your browser does not support recording APIs required by this app.');
      recordBtn.disabled = true;
    }

    renderMemos();
  </script>
</body>
</html>
